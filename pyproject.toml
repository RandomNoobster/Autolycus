[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autolycus"
version = "0.1.0"
description = "Autolycus backend, bot, scanner, and tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymongo==4.18.3",
  "motor==3.7.1",
  "dnspython==2.9.2",
  "flask[async]==3.1.3",
  "flask-cors==6.0.2",
  "waitress==3.0.2",
  "werkzeug==3.1.9",
  "itsdangerous==2.2.0",
  "aiohttp==3.14.5",
  "requests>=2.33.0",
  "pnwkit-py==2.6.26",
  "python-dotenv==1.2.2",
  "aiofiles==25.1.0",
  "aiocache[redis]==0.12.3",
  "py-cord==2.7.1",
  "watchfiles==1.1.1",
  "xkcdpass==1.30.0",
  "pywebpush==2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "watchfiles==1.1.1",
]

[project.scripts]
api = "api.app:run_api"
bot = "bot.main:run_bot"

[tool.uv]
package = true
# pnwkit-py 2.6.26 is unmaintained (last release Feb 2024) and caps aiohttp<3.9 and
# requests<2.29, which keeps both on versions with known vulnerabilities. These
# overrides replace every requirement on these packages, including the ones in
# `dependencies` above, so keep the two in sync when upgrading.
override-dependencies = [
  "aiohttp==3.14.5",
  "requests>=2.33.0",
]

[tool.setuptools]
py-modules = ["scanner"]

[tool.setuptools.packages.find]
include = ["api*", "bot*", "core*", "database*", "infra*", "logic*", "services*"]
